<p>Completa el formulario y pulsa el botón. Los valores se mostrarán en la consola del navegador: ábrela con F12 y selecciona Consola.</p><form id="form1" onsubmit="return getFormvalue(event)"><label for="nombre">Nombres</label><input id="nombre" type="text" name="fname" value="Cesar Joseph" autocomplete="given-name" required><label for="apellidos">Apellidos</label><input id="apellidos" type="text" name="lname" value="Luna Chiu" autocomplete="family-name" required><button type="submit">Mostrar en consola</button></form><p id="estado" role="status"></p>
